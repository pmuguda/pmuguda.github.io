name: Sync YouTube playlist

# Rebuilds the Media section's video cards from the SAR from First Principles
# playlist. YouTube's RSS feed sends no CORS headers, so the page can't fetch it
# in the browser — this keeps the published page static by regenerating the
# markup here and committing the result. Pages (legacy branch build) redeploys
# on the resulting push.

on:
  schedule:
    - cron: '17 6 * * *'      # daily, 06:17 UTC
  workflow_dispatch:           # run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pillow

      - name: Sync playlist into index.html
        run: python3 scripts/sync_youtube.py

      - name: Commit if the playlist changed
        run: |
          if git diff --quiet && git diff --quiet --cached && [ -z "$(git status --porcelain)" ]; then
            echo "No changes — playlist is already in sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 'yt-*.webp'
          git commit -m "Sync video cards from YouTube playlist [skip ci]"
          git push
